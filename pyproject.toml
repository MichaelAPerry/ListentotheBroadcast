[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "listen-to-the-broadcast"
version = "0.1.0"
description = "Turn local-network broadcast traffic into ambient MIDI for any DAW or plugin host"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    # native app window; on Linux install pywebview[qt] or [gtk] yourself, else the browser is used
    "pywebview>=5; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ltb = "ltb.__main__:main"

[tool.setuptools]
packages = ["ltb"]

[tool.setuptools.package-data]
ltb = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

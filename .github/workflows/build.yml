name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach files to a Release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build plugin and tests
        run: cmake --build build --config Release --parallel --target ListenToTheBroadcast_VST3 ltb_core_tests ltb_plugin_tests

      - name: Core tests
        run: build\Release\ltb_core_tests.exe

      - name: Plugin tests (offline render, real network listener, editor)
        run: build\ltb_plugin_tests_artefacts\Release\ltb_plugin_tests.exe plugin-window.png

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval.exe is a GUI-subsystem program: PowerShell won't wait for it (or get its exit
          # code) unless started with -Wait. Out-of-process so a crash would come back with a stack trace.
          $args = '--strictness-level 10 --output-dir pluginval-logs --validate "build\ListenToTheBroadcast_artefacts\Release\VST3\Listen to the Broadcast.vst3"'
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList $args -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "pluginval failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs-windows
          path: pluginval-logs

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item -Recurse "build\ListenToTheBroadcast_artefacts\Release\VST3\Listen to the Broadcast.vst3" package\
          # Debug symbols stay out of the download (smaller, and only useful to developers).
          Get-ChildItem package -Recurse -Include *.pdb,*.lib,*.exp | Remove-Item
          Copy-Item INSTALL-Windows.txt package\
          $dll = Get-ChildItem package -Recurse -Filter "*.vst3" | Where-Object { -not $_.PSIsContainer }
          (Get-FileHash $dll.FullName -Algorithm SHA256).Hash + "  Listen to the Broadcast.vst3 (plugin DLL)" | Out-File package\SHA256.txt -Encoding ascii
          Compress-Archive -Path package\* -DestinationPath ListenToTheBroadcast-VST3-Windows.zip
          (Get-FileHash ListenToTheBroadcast-VST3-Windows.zip -Algorithm SHA256).Hash + "  ListenToTheBroadcast-VST3-Windows.zip" | Out-File ListenToTheBroadcast-VST3-Windows.zip.sha256 -Encoding ascii
          Get-Content package\SHA256.txt, ListenToTheBroadcast-VST3-Windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ListenToTheBroadcast-VST3-Windows
          path: |
            ListenToTheBroadcast-VST3-Windows.zip
            ListenToTheBroadcast-VST3-Windows.zip.sha256

      # Pushing a tag like v1.0.0 publishes a GitHub Release with the zip and its checksum.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ListenToTheBroadcast-VST3-Windows.zip
            ListenToTheBroadcast-VST3-Windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-window-screenshot
          path: plugin-window.png

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev xvfb
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target ListenToTheBroadcast_VST3 ltb_core_tests ltb_plugin_tests
      - run: ./build/ltb_core_tests
      - run: ./build/ltb_plugin_tests_artefacts/Release/ltb_plugin_tests
      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --validate "build/ListenToTheBroadcast_artefacts/Release/VST3/Listen to the Broadcast.vst3"
